# Managed by the SimplePlane subscription deployment on 212.64.14.155.
limit_req_zone $binary_remote_addr zone=sp_subscription_devices:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=sp_subscription_login:1m rate=10r/s;
server {
    listen 443 ssl;
    server_name 212.64.14.155;
    ssl_certificate /opt/simpleplane-subscriptions/relay/tls.crt;
    ssl_certificate_key /opt/simpleplane-subscriptions/relay/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/simpleplane-subscriptions-nginx.log crit;
    client_max_body_size 64k;
    limit_req_status 429;
    proxy_set_header Host 212.64.14.155;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    location = / { return 302 /account/devices; }
    location ^~ /device/ {
        limit_req zone=sp_subscription_devices burst=24 nodelay;
        proxy_pass http://127.0.0.1:18181;
    }
    location ~ ^/(account/|admin/|sso/|subscription[.]css$) {
        proxy_pass http://127.0.0.1:18181;
    }
    location ~ ^/([.]well-known/|oauth2/|connect/|userinfo$|login($|/|[.](css|js)$)|logout$) {
        limit_req zone=sp_subscription_login burst=40 nodelay;
        proxy_pass http://127.0.0.1:18082;
    }
    location / { return 404; }
}
