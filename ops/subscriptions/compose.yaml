name: simpleplane-subscriptions
x-process: &process
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:rw,exec,nosuid,size=48m"]
  cpus: 1.0
  pids_limit: 150
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}
services:
  sessions:
    <<: *process
    image: redis:7-alpine
    user: redis
    entrypoint: [redis-server, /settings/redis.conf]
    mem_limit: 64m
    memswap_limit: 64m
    volumes:
      - ./config/redis.conf:/settings/redis.conf:ro
      - sessions:/data
    networks: [control]
  identity:
    <<: *process
    image: authsystem-sso-server:0.1.2-browser-fix
    entrypoint: [java, -XX:ActiveProcessorCount=2, -XX:+UseSerialGC, -Xms24m, -Xmx128m, -XX:ReservedCodeCacheSize=32m, -Xss512k, -Dsso.oidc-use-configured-keystore=true, -jar, /app/identity.jar]
    environment: {MALLOC_ARENA_MAX: "2"}
    mem_limit: 416m
    memswap_limit: 416m
    env_file: ./config/identity.env
    volumes:
      - ./identity.jar:/app/identity.jar:ro
      - /opt/authsystem-simple-sso/secrets:/run/secrets:ro
    depends_on: [sessions]
    networks: [control, middleware]
    ports: ["127.0.0.1:18082:8080"]
  portal:
    <<: *process
    image: eclipse-temurin:17-jre-jammy
    entrypoint: [java, -XX:ActiveProcessorCount=2, -XX:+UseSerialGC, -Xms24m, -Xmx112m, -XX:ReservedCodeCacheSize=32m, -Xss512k, -Djavax.net.ssl.trustStore=/pki/trust.p12, -Djavax.net.ssl.trustStorePassword=changeit, -jar, /app/portal.jar]
    environment: {MALLOC_ARENA_MAX: "2"}
    mem_limit: 336m
    memswap_limit: 336m
    env_file: ./config/portal.env
    volumes:
      - ./portal.jar:/app/portal.jar:ro
      - ./node-runtime.jar:/app/node-runtime.jar:ro
      - ./pki/trust.p12:/pki/trust.p12:ro
      - ./pki/root.crt:/pki/root.crt:ro
      - ./pki/device.p12:/pki/device.p12:ro
      - ./pki/catalog:/pki/catalog:ro
    depends_on: [sessions, identity]
    networks: [control, middleware]
    ports: ["127.0.0.1:18181:18181"]
  relay:
    <<: *process
    image: eclipse-temurin:17-jre-jammy
    entrypoint: [java, -XX:ActiveProcessorCount=2, -Xms16m, -Xmx64m, -Dsimpleplane.deviceCaFile=/relay/device.crt, -cp, "/relay:/app/relay.jar", com.proxy.remote.ProxyRemoteServer]
    mem_limit: 160m
    memswap_limit: 160m
    volumes:
      - ./relay.jar:/app/relay.jar:ro
      - ./relay:/relay:ro
    networks: [control]
    ports: ["443:9443/udp"]
volumes:
  sessions:
networks:
  control: {}
  middleware:
    external: true
    name: middleware-network
