<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="nodes" class="scroll"><table><thead><tr><th>节点</th><th>所属分组</th><th>发布状态</th></tr></thead><tbody>
<tr th:each="n:${nodes}"><td><a th:href="@{/admin/nodes/{id}(id=${n.node_id})}" th:text="${n.label}"></a><small class="num" th:text="|${n.host}:${n.port}|"></small></td>
<td th:text="${n.group_labels?:'未分配'}"></td><td><span class="pill" th:classappend="${n.enabled}?'up'" th:text="${n.enabled?'已上线':'已下线'}"></span></td></tr>
</tbody></table><p class="empty" th:if="${nodes.empty}">还没有节点。</p></div>
<span th:fragment="userstate" class="pill" th:with="active=${u.valid_until!=null and u.valid_until>now and u.device_limit>0}" th:classappend="${active}?'up'" th:text="${!u.enabled?'登录已停用':(active?'有效':(u.group_id==null?'未开通':'已停止'))}"></span>
<div th:fragment="history" class="scroll"><p th:if="${recent.empty}" class="empty">开通用户、分配线路等操作会记录在这里。</p><table th:unless="${recent.empty}"><thead><tr><th>操作</th><th>对象</th><th>操作人</th><th>时间</th></tr></thead><tbody>
<tr th:each="r:${recent}"><td th:text="${r.action_name}"></td><td th:text="${r.target}"></td><td th:text="${r.operator_name}"></td><td class="num" th:text="${fmt.date(r.happened_at)}"></td></tr></tbody></table></div>
</body></html>
