# =========================================================
# SimplePlane 一键编排：Proxy Remote + LogLens 连接/日志面板 + proxy-local
#
# 用法（项目根目录）：
#   docker compose up -d --build          # 构建并后台启动服务端、面板和本地代理
#   docker compose logs -f                # 跟踪日志
#   docker compose down                   # 停止并移除
#
# 说明：
#   - proxy-local 通过 compose 内置 DNS 以服务名 "proxy-remote" 连接服务端
#   - LogLens Web 仍绑定容器 loopback；relay 通过宿主机 loopback 9527 暴露给 SSH 隧道
#   - 9090 默认只在 compose 内网开放；需要外部客户端时叠加 docker-compose.remote-public.yml
#   - 两端的 cipher / cipherKey 必须一致（见 docker/remote.yml 与 docker/proxy.yml）
# =========================================================

services:
  proxy-remote:
    build:
      context: .
      dockerfile: docker/Dockerfile.remote
    image: netty-proxy-remote:1.0.0
    container_name: netty-proxy-remote
    restart: unless-stopped
    # LogLens Agent 严格绑定容器 loopback；独立 relay 监听容器端口 19527，
    # 这里只把该端口发布到宿主机 loopback，供 SSH 隧道转发。
    ports:
      - "127.0.0.1:9527:19527/tcp"
    expose:
      - "9090"
    volumes:
      - ./docker/remote.yml:/app/config/remote.yml:ro
      - ./docker/loglens-proxyremote.yaml:/app/config/loglens.yaml:ro
      - ./loglens-data:/var/lib/loglens
    # 可选 Elasticsearch API key：只透传宿主机同名环境变量，不写入 Compose/YAML。
    environment:
      LOG_LENS_ELASTICSEARCH_API_KEY:
    networks:
      - proxy-net
    healthcheck:
      # 代理监听与 Agent loopback 面板均可连接后才视为就绪。
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9090' 2>/dev/null && bash -c '</dev/tcp/127.0.0.1/9527' 2>/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  loglens-panel-relay:
    build:
      context: .
      dockerfile: docker/Dockerfile.panel-relay
    image: simpleplane-loglens-panel-relay:1.0.0
    container_name: simpleplane-loglens-panel-relay
    restart: unless-stopped
    # 与 proxy-remote 共享网络命名空间，才能从其 loopback 访问 LogLens。
    network_mode: "service:proxy-remote"
    depends_on:
      proxy-remote:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "socat -T 2 -u /dev/null TCP:127.0.0.1:19527"]
      interval: 10s
      timeout: 3s
      retries: 3

  proxy-local:
    build:
      context: .
      dockerfile: docker/Dockerfile.local
    image: netty-proxy-local:1.0.0
    container_name: netty-proxy-local
    restart: unless-stopped
    depends_on:
      proxy-remote:
        condition: service_healthy
    ports:
      # 只允许宿主机本机应用使用 SOCKS5 / HTTP CONNECT。
      - "127.0.0.1:1080:1080"
    volumes:
      - ./docker/proxy.yml:/app/config/proxy.yml:ro
      # 持久化本地端日志
      - ./logs:/app/logs
    networks:
      - proxy-net

networks:
  proxy-net:
    driver: bridge
