# SimplePlane HTTP/3/QUIC server and optional desktop local proxy.

services:
  proxy-remote:
    build:
      context: .
      dockerfile: docker/Dockerfile.remote
    image: netty-proxy-remote:1.0.0
    container_name: netty-proxy-remote
    restart: unless-stopped
    ports:
      - "9090:9090/udp"
    expose:
      - "9090/udp"
    volumes:
      - ./docker/remote.yml:/app/config/remote.yml:ro
      # Put fullchain.pem and privkey.pem in ./certs, or change this mount.
      - ./certs:/etc/simpleplane/tls:ro
    networks:
      - proxy-net

  proxy-local:
    build:
      context: .
      dockerfile: docker/Dockerfile.local
    image: netty-proxy-local:1.0.0
    container_name: netty-proxy-local
    restart: unless-stopped
    depends_on:
      - proxy-remote
    ports:
      - "1080:1080"
    volumes:
      - ./docker/proxy.yml:/app/config/proxy.yml:ro
      - ./logs:/app/logs
    networks:
      - proxy-net

networks:
  proxy-net:
    driver: bridge
