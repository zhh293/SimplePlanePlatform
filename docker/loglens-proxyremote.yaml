schemaVersion: 1
application: simpleplane-proxy
agent:
  mode: observe
  consoleAppenderNames: [CONSOLE]
  failurePolicy: FALLBACK_OBSERVE
  pluginsDirectory: /app/plugins
capture:
  levels: [TRACE, DEBUG, INFO, WARN, ERROR]
  includeLoggers: []
  excludeLoggers: [io.loglens]
  maxMessageChars: 16384
  maxStackFrames: 128
  captureCaller: false
runtime:
  ringBufferSize: 8192
  overflowPolicy: DROP_NEWEST
  tickMillis: 200
  shutdownTimeoutMillis: 5000
redaction:
  mdcKeys: [token, password]
  messageRules:
    - id: token
      pattern: '(token=)[^\s,]+'
      replacement: '$1***'
pipeline:
  - id: extract
    provider: builtin-field-extract
    config:
      rules: []
  - id: template
    provider: builtin-template
    config:
      preferOriginalTemplate: true
  - id: fold
    provider: builtin-repeat-fold
    config:
      windowMillis: 3000
      maxGroups: 10000
      maxSamplesPerGroup: 3
      bypassLevels: [ERROR]
      groupBy: [logger, level, template, exceptionType]
  - id: correlate
    provider: builtin-correlation
    config:
      fields: [traceId]
  - id: highlight
    provider: builtin-highlight
    config:
      firstOccurrence: true
      maxSeenTemplates: 10000
      keywords: [ERROR, Exception, timeout]
output:
  directory: /var/lib/loglens
  text:
    combined: true
    splitByLevel: true
    rotateSizeMiB: 100
    retentionDays: 14
  structured:
    enabled: true
    rotateSizeMiB: 100
    maxDiskMiB: 4096
  search:
    # 默认继续使用本地 SQLite。切换 Elasticsearch 时还需配置容器可达的 endpoint。
    backend: sqlite
    endpoint: http://127.0.0.1:9200
    indexPrefix: loglens
    apiKeyEnv: LOG_LENS_ELASTICSEARCH_API_KEY
    connectTimeoutMillis: 1000
    requestTimeoutMillis: 3000
  console:
    processed: false
proxyRemote:
  enabled: true
  sampleIntervalMillis: 1000
  maxTrackedConnections: 10000
  maxTrackedSessions: 50000
web:
  enabled: true
  host: 127.0.0.1
  port: 9527
  recentRecords: 5000
  clientQueueSize: 1000
