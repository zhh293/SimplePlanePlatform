# proxy-remote HTTP/3/QUIC server configuration.
# The TLS certificate and private key must be mounted at these paths.
host: 0.0.0.0
port: 9090
transport: http3

bizThreads: 200
workerThreads: 0
bossThreads: 1

# Must match the Android app exactly.
cipher: chacha20
cipherKey: your-cipher-key

maxStreams: 1000
readIdleTimeout: 60
backlog: 1024

http3:
  certificateFile: /etc/simpleplane/tls/fullchain.pem
  privateKeyFile: /etc/simpleplane/tls/privkey.pem
  idleTimeoutMs: 60000
  maxStreamsPerConnection: 1000
  initialConnectionWindow: 16777216
  initialStreamWindow: 1048576
  maxProxyMessageBytes: 8388608
  streamPendingHardLimit: 4194304
  connectionPendingHardLimit: 67108864
  writeBufferLowWaterMark: 262144
  writeBufferHighWaterMark: 1048576

outbound:
  connectTimeoutMs: 5000
  activeWaitTimeoutMs: 5000
  keepAlive: true
  tcpNoDelay: true
