# ===================================
# proxy-remote 容器外部配置（挂载到 /app/config/remote.yml）
# ===================================

# 容器内监听所有网卡
host: 0.0.0.0
port: 9090
transport: http2

bizThreads: 200
workerThreads: 0
bossThreads: 1

# 加密算法与密钥：必须与 proxy-local 端完全一致
# Android plane-core currently speaks the project's compatible chacha20 format.
# Change this value before deployment and enter the same value in the Android app.
cipher: chacha20
cipherKey: your-cipher-key

maxStreams: 100
readIdleTimeout: 60
backlog: 1024

outbound:
  connectTimeoutMs: 5000
  activeWaitTimeoutMs: 5000
  keepAlive: true
  tcpNoDelay: true
